[project]
name = "agentic-rag"
version = "0.1.0"
description = "Production-grade agentic RAG system"
requires-python = ">=3.11"
dependencies = [
    "pydantic-settings>=2.4",
    "markitdown>=0.1.0",
    "requests>=2.31",
    "qdrant-client>=1.12",
    "fastembed>=0.4",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.3",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_rag"]
