[project]
name = "agentic-rag"
version = "0.1.0"
description = "Production-grade agentic RAG system"
requires-python = ">=3.11"
dependencies = [
    "pydantic-settings>=2.4",
    "markitdown>=0.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_rag"]
